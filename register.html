<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרשמה</title>
<style>
  :root{ --brand:#B91717; --brand-dark:#8F1111; --brand-tint:rgba(185,23,23,.07); --brand-ring:rgba(185,23,23,.22);
         --ink:#1B1B1B; --muted:#6F6B64; --line:#DCD8D0; --soft:#F6F4F0; --bg:#EFEDE8; --err:#B00020; --ok:#2F7A3B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Heebo','Segoe UI',system-ui,Arial,sans-serif; -webkit-text-size-adjust:100%; }
  .hdr{ background:#000; border-bottom:4px solid var(--brand); text-align:center; padding:14px 16px 12px; }
  .hdr .logo{ height:70px; max-width:78%; object-fit:contain; display:inline-block; }
  .page{ max-width:660px; margin:-1px auto 0; padding:18px 14px 40px; }
  .wrap{ background:#fff; border-radius:16px; padding:26px 22px 30px; box-shadow:0 8px 30px rgba(0,0,0,.10); }
  h1{ font-size:27px; line-height:1.25; margin:0 0 8px; letter-spacing:-.2px; }
  .intro{ color:#4A4742; line-height:1.7; margin:4px 0 16px; white-space:pre-line; font-size:16px; }
  .progress{ position:sticky; top:0; z-index:5; background:#fff; padding:10px 0 8px; margin:0 0 6px; }
  .progress .track{ height:7px; border-radius:4px; background:#ECE9E3; overflow:hidden; }
  .progress .bar{ height:100%; width:0; background:var(--brand); border-radius:4px; transition:width .35s ease; }
  .progress .lab{ font-size:12.5px; color:var(--muted); margin-top:5px; }
  .banner{ display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:800; font-size:19px; padding:0 0 9px; margin:34px 0 14px; border-bottom:2px solid var(--brand); }
  .banner::before{ content:''; width:10px; height:24px; background:var(--brand); border-radius:3px; flex:none; }
  .info{ line-height:1.7; margin:14px 0; padding:12px 14px; background:var(--soft); border-inline-start:4px solid var(--brand); border-radius:8px; white-space:pre-line; font-size:15.5px; }
  .q{ margin:20px 0; }
  .q > label.lbl, .q > .lbl{ display:block; font-weight:700; margin-bottom:8px; line-height:1.45; font-size:16px; }
  .req{ color:var(--err); margin-inline-start:4px; font-weight:800; }
  .help{ color:var(--muted); font-size:13.5px; margin-top:6px; line-height:1.5; }
  input[type=text], input[type=tel], input[type=number], select, textarea{
    width:100%; padding:14px 14px; font-size:16px; font-family:inherit; border:1.5px solid var(--line); border-radius:10px; background:#FCFBF9; color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s; -webkit-appearance:none; appearance:none; }
  select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%236F6B64' stroke-width='2' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:left 14px center; padding-inline-end:14px; padding-left:38px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-ring); background:#fff; }
  input[type=tel], .q input[inputmode=numeric]{ direction:ltr; text-align:right; }
  textarea{ min-height:96px; resize:vertical; line-height:1.5; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:13px 14px; margin:8px 0; font-size:16px; line-height:1.45; cursor:pointer; border:1.5px solid var(--line); border-radius:12px; background:#fff; transition:border-color .15s, background .15s, box-shadow .15s; }
  .opt:hover{ border-color:#BDB8AE; }
  .opt.on, .opt:has(input:checked){ border-color:var(--brand); background:var(--brand-tint); box-shadow:0 0 0 1px var(--brand) inset; }
  .opt input{ -webkit-appearance:none; appearance:none; width:22px; height:22px; margin:1px 0 0; flex:none; border:2px solid #A9A398; background:#fff; display:grid; place-content:center; cursor:inherit; transition:all .12s; }
  .opt input[type=radio]{ border-radius:50%; }
  .opt input[type=checkbox]{ border-radius:6px; }
  .opt input:checked{ background:var(--brand); border-color:var(--brand); }
  .opt input[type=checkbox]:checked::after{ content:''; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg); }
  .opt input[type=radio]:checked::after{ content:''; width:8px; height:8px; border-radius:50%; background:#fff; }
  .opt input:focus-visible{ outline:3px solid var(--brand-ring); outline-offset:2px; }
  .opt.disabled{ opacity:.5; cursor:not-allowed; background:var(--soft); }
  .full-tag{ color:var(--err); font-weight:800; font-size:13px; }
  .gbox .sec{ font-weight:800; margin:22px 0 4px; font-size:15px; color:var(--brand); }
  .gbox .sec:first-child{ margin-top:6px; }
  .err{ color:var(--err); font-size:14px; margin-top:7px; font-weight:600; }
  .q.has-error input[type=text], .q.has-error input[type=tel], .q.has-error select, .q.has-error textarea{ border-color:var(--err); background:#FFF8F8; }
  .q.has-error .opt{ border-color:#E8B4BC; }
  .count-hint{ background:#FFF7E0; border:1px solid #EAD48A; border-radius:10px; padding:10px 14px; font-size:14.5px; margin:8px 0; }
  .submit{ width:100%; padding:17px; margin-top:26px; background:var(--brand); color:#fff; border:none; border-radius:12px; font-size:19px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:0 6px 18px var(--brand-ring); transition:transform .1s, background .15s; position:sticky; bottom:12px; z-index:4; }
  .submit:hover{ background:var(--brand-dark); } .submit:active{ transform:scale(.985); }
  .submit[disabled]{ opacity:.65; cursor:wait; }
  .secure{ text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
  .hp{ position:absolute; left:-9999px; top:-9999px; height:0; width:0; overflow:hidden; }
  .panel{ text-align:center; padding:30px 6px 18px; }
  .panel h2{ margin:14px 0 10px; font-size:26px; }
  .panel p{ line-height:1.7; font-size:17px; white-space:pre-line; color:#3F3C37; }
  .ok-ic{ width:76px; height:76px; border-radius:50%; background:var(--ok); margin:0 auto; display:grid; place-content:center; animation:pop .45s cubic-bezier(.2,1.4,.4,1) both; }
  .ok-ic::after{ content:''; width:20px; height:38px; border:solid #fff; border-width:0 6px 6px 0; transform:translateY(-4px) rotate(45deg); }
  .panel .ic-plain{ font-size:46px; }
  @keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .btn{ display:inline-block; background:var(--brand); color:#fff; text-decoration:none; padding:15px 30px; border-radius:12px; font-weight:800; font-size:18px; margin:12px 4px 4px; border:none; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px var(--brand-ring); }
  .btn.sec{ background:#fff; color:var(--brand); border:2px solid var(--brand); box-shadow:none; }
  .redir{ margin-top:16px; } .redir .track{ height:5px; background:#ECE9E3; border-radius:3px; overflow:hidden; max-width:260px; margin:8px auto 0; } .redir .bar{ height:100%; background:var(--brand); width:0; }
  .ftr{ text-align:center; color:var(--muted); font-size:13px; padding:18px 10px 6px; line-height:1.7; }
  .ftr a{ color:var(--muted); }
  .preview-bar{ background:#FFF1B8; border:1px solid #E4C75A; padding:9px 12px; margin:0 0 16px; border-radius:10px; font-size:14px; }
  .preview-result{ background:#EEF6EE; border:1px solid #9CC79C; border-radius:12px; padding:14px 16px; margin-top:18px; font-size:15px; line-height:1.8; text-align:right; }
  .preview-result.bad{ background:#FDECEE; border-color:#E2A0A8; }
  .preview-result code{ direction:ltr; display:inline-block; word-break:break-all; background:#fff; padding:1px 6px; border-radius:4px; }
  a{ color:#0B57D0; }
  @media (max-width:480px){ .wrap{ padding:22px 16px 26px; border-radius:14px; } h1{ font-size:24px; } .page{ padding:14px 10px 34px; } }
</style>
</head>
<body>

<div class="page">
<div class="wrap" id="root"><p style="text-align:center;color:#666;">טוען…</p></div>
<footer class="ftr" id="ftr"></footer>
</div>

  function uid(){ var a = new Uint8Array(12); (window.crypto||window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
  function waLink(){
    var n = ((cfg && cfg.general && cfg.general.whatsapp) || '').replace(/\D/g,'');

  // text with {whatsapp} / {terms} placeholders and bare URLs turned into links
  function richText(text){
    var frag = document.createDocumentFragment();
    var g = (cfg && cfg.general) || {};
    var re = /(\{whatsapp\}|\{terms\}|https?:\/\/[^\s]+)/g, last = 0, m;
    text = String(text || '');
    while ((m = re.exec(text))){
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var t = m[0], href = t, label = t;
      if (t === '{whatsapp}'){ href = waLink(); label = g.whatsapp || 'וואטסאפ'; }
      else if (t === '{terms}'){ href = g.termsUrl || ''; label = g.termsLabel || 'תקנון ההשתתפות והצהרת הבריאות'; }
      if (href) frag.appendChild(h('a', {href:href, target:'_blank', rel:'noopener'}, [label])); else frag.appendChild(document.createTextNode(label));

    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));

  function asArr(v){ return v == null || v === '' ? [] : (Array.isArray(v) ? v : [v]); }

  // ---------------- network (same pattern as the studio app) ----------------
  function jsonp(extra, timeoutMs){
    return new Promise(function(resolve, reject){
      var cb = '__fcb' + Date.now() + Math.floor(Math.random()*1e5), s = document.createElement('script'), done = false;
      var tid = setTimeout(function(){ if (done) return; done = true; if (s.parentNode) s.parentNode.removeChild(s); reject(new Error('timeout')); }, timeoutMs || 20000);
      window[cb] = function(d){ if (done) return; done = true; clearTimeout(tid); if (s.parentNode) s.parentNode.removeChild(s); resolve(d); };
      s.onerror = function(){ if (done) return; done = true; clearTimeout(tid); reject(new Error('network')); };
      s.src = SHEETS_API_URL + '?key=' + encodeURIComponent(PUBLIC_KEY) + '&callback=' + cb + extra;
      document.head.appendChild(s);
    });
  }
  function postForm(fields){
    return new Promise(function(resolve){
      var name = '__ff' + Date.now() + Math.floor(Math.random()*1e5);
      var iframe = h('iframe', {name:name, style:'display:none'});
      document.body.appendChild(iframe);
      var form = h('form', {method:'POST', action:SHEETS_API_URL, target:name, style:'display:none'});
      fields.key = PUBLIC_KEY;
      Object.keys(fields).forEach(function(k){ form.appendChild(h('input', {name:k, value:fields[k]})); });
      document.body.appendChild(form);
      var armed = false, settled = false;
      function done(){ if (settled) return; settled = true; clearTimeout(tid); setTimeout(function(){ if (form.parentNode) form.parentNode.removeChild(form); if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 1500); resolve(); }
      var tid = setTimeout(done, 45000);
      iframe.addEventListener('load', function(){ if (armed) done(); });
      form.submit();
      setTimeout(function(){ armed = true; }, 0);
    });
  }

  // ---------------- logic ----------------
  function qById(id){ return (formCfg.questions || []).filter(function(q){ return q.id === id; })[0]; }
  function condsMet(conds){
    return (conds || []).every(function(c){
      var vals = asArr(answers[c.q]);
      var list = c.values || [];
      if (c.op === 'empty') return vals.length === 0;
      if (c.op === 'notEmpty') return vals.length > 0;
      var any = vals.some(function(v){ return list.indexOf(v) !== -1; });
      return c.op === 'notIn' ? !any : any;
    });
  }
  function isVisible(q){ return condsMet(q.showIf); }
  function hasInput(q){ return q.type !== 'heading' && q.type !== 'info'; }

  function eligibleGroups(q){
    var gc = q.groups || {};
    var sel = gc.filterBy ? asArr(answers[gc.filterBy]) : null;
    return (cfg.groups || []).filter(function(g){
      if (g.active === false) return false;
      if ((g.forms || []).indexOf(FORM) === -1) return false;
      if (!gc.filterBy) return true;
      return (g.showFor || []).some(function(v){ return sel.indexOf(v) !== -1; });
    });
  }
  function requiredGroupCount(q){
    var gc = q.groups || {};

      var cq = qById(gc.countFrom), a = asArr(answers[gc.countFrom])[0];
      var opt = cq && (cq.options || []).filter(function(o){ return o.label === a; })[0];
      if (opt && Number(opt.count) > 0) return Number(opt.count);
      return null;                       // not answered yet
    }
    return Number(gc.exact) > 0 ? Number(gc.exact) : null;
  }

  function requiredGroupCountFromAnswer(q){ return !!((q.groups || {}).countFrom); }
  function normalizePhone(v){
    var d = String(v || '').replace(/\D/g, '');
    if (d.indexOf('972') === 0) d = '0' + d.slice(3);

  }
  function validPhone(v){ return /^0\d{8,9}$/.test(normalizePhone(v)); }

  function validate(){
    var errs = {};
    (formCfg.questions || []).forEach(function(q){
      if (!hasInput(q) || !isVisible(q)) return;
      var v = asArr(answers[q.id]);
      if (q.type === 'groups'){
        var need = requiredGroupCount(q);
        if (need){ if (v.length !== need) errs[q.id] = 'יש לבחור ' + (need === 1 ? 'קבוצה אחת' : need + ' קבוצות') + ' (נבחרו ' + v.length + ')'; }
        else if (q.required && !v.length) errs[q.id] = 'יש לבחור לפחות קבוצה אחת';
        return;
      }
      if (q.required && !v.length) { errs[q.id] = q.type === 'single_checkbox' ? 'יש לאשר כדי להמשיך' : 'שדה חובה'; return; }
      if (q.type === 'phone' && v.length && !validPhone(v[0])) errs[q.id] = 'מספר טלפון לא תקין (למשל 0501234567)';
      if (q.type === 'number' && v.length && isNaN(Number(v[0]))) errs[q.id] = 'נא להזין מספר';

    return errs;
  }

  // ---------------- routing (the same rules the admin screen edits) ----------------
  function evaluateRoute(){
    var rt = formCfg.routing || {};
    var specials = rt.special || [];
    for (var i = 0; i < specials.length; i++){
      if ((specials[i].when || []).length && condsMet(specials[i].when)){
        var a = specials[i].action || {};

      }
    }
    var mx = rt.matrix;
    if (mx && mx.enabled && mx.rowQ && mx.colQ){
      var r = asArr(answers[mx.rowQ])[0], c = asArr(answers[mx.colQ])[0];
      var cell = (mx.cells || {})[r + '|' + c];
      if (r != null && c != null && cell && cell.url) return { source:'טבלה: ' + r + ' × ' + c, type:'redirect', url:cell.url, message:'' };
    }

  // ---------------- building the submission ----------------
  function displayValue(q){
    var v = asArr(answers[q.id]);

      return v.map(function(id){ return byId[id] ? byId[id].name : id; }).join(' | ');

  function buildPayload(route){

      raw[q.id] = (q.type === 'checkbox' || q.type === 'groups') ? v : (v[0] != null ? v[0] : '');

  // "X of Y required fields done"
  function updateProgress(){

  // ---------------- rendering ----------------
  var wrappers = {};         // question id -> wrapper element

  function buildQuestion(q){
    var w = h('div', {class:'q'});

  function renderGroups(q){
    var box = wrappers[q.id] && wrappers[q.id].querySelector('.gbox'); if (!box) return;
    var gc = q.groups || {};

    if (lastGroupSig[q.id] === sig && box.children.length) return;
    lastGroupSig[q.id] = sig;
    box.innerHTML = '';

      var fq = qById(gc.filterBy);

  // once the required number is selected, the other groups are greyed out

  // ---------------- submit ----------------
  function showMsg(t){ var m = document.getElementById('form_msg'); if (m) m.textContent = t || ''; }

  async function onSubmit(){
    if (submitting) return;
    showMsg('');
    var errs = validate(), first = null;
    (formCfg.questions || []).forEach(function(q){ if (hasInput(q)) setErr(q.id, errs[q.id] || null); });
    var ids = Object.keys(errs);
    if (ids.length){
      var w = wrappers[ids[0]]; if (w && w.scrollIntoView) w.scrollIntoView({behavior:'smooth', block:'center'});
      showMsg('יש ' + ids.length + (ids.length === 1 ? ' שדה' : ' שדות') + ' שצריך להשלים או לתקן.');
      if (PREVIEW) postToParent({type:'tatami-preview-result', valid:false, errors:errs});
      return;
    }
    var route = evaluateRoute();
    var payload = buildPayload(route);
    if (PREVIEW){ showPreviewResult(payload, route); return; }

    submitting = true;
    var btn = document.getElementById('submit_btn'); btn.disabled = true; btn.textContent = 'שולח…';
    var id = window.__submissionId || (window.__submissionId = uid());        // the same id on a retry => never stored twice
    try{
      var hp = (document.getElementById('hp_field') || {}).value || '';
      await postForm({ action:'submitForm', form:FORM, id:id, hp:hp, elapsed:String(Date.now() - startedAt), data:JSON.stringify(payload) });
      var stored = false;
      for (var i = 0; i < 8 && !stored; i++){
        try{ var r = await jsonp('&action=checkSubmission&form=' + FORM + '&id=' + id, 15000); stored = !!(r && r.exists); }catch(e){}
        if (!stored) await new Promise(function(res){ setTimeout(res, 1500); });
      }
      if (!stored) throw new Error('not stored');
      clearDraft();
      showResult(route);
    }catch(e){
      submitting = false; btn.disabled = false; btn.textContent = formCfg.submitLabel || 'שליחה';
      showMsg('לא הצלחנו לשלוח כרגע. בדקו את החיבור ולחצו שוב — הפרטים שמילאתם נשמרו. אם זה חוזר, פנו אלינו בוואטסאפ' + (waLink() ? ': ' : '.'));
      var m = document.getElementById('form_msg'); if (m && waLink()) m.appendChild(h('a', {href:waLink(), target:'_blank', text:(cfg.general.whatsapp || '')}));
    }
  }

  function showResult(route){
    var after = formCfg.after || {};
    root.innerHTML = '';
    var panel = h('div', {class:'panel'});
    var msg = route.type === 'redirect' ? (after.message || 'תודה! הפרטים התקבלו.') : (route.message || after.message || 'תודה! הפרטים התקבלו ונחזור אליכם בהקדם.');
    panel.appendChild(h('div', {class:'ok-ic'}));
    panel.appendChild(h('h2', {text:'הפרטים התקבלו'}));
    panel.appendChild(h('p', {}, [richText(msg)]));
    if (route.type === 'redirect' && route.url){
      panel.appendChild(h('a', {class:'btn', href:route.url}, [after.buttonLabel || 'המשך']));
      if ((after.mode || 'auto') === 'auto'){
        var secs = Math.max(0, Number(after.delaySec) || 0);
        var note = h('div', {class:'redir'}, [h('div', {class:'help', id:'redir_txt', text:'מעבירים אותך בעוד ' + secs + ' שניות…'}), h('div', {class:'track'}, [h('div', {class:'bar', id:'redir_bar'})])]);
        panel.appendChild(note);
        if (secs === 0){ window.location.href = route.url; }
        else {
          var t0 = Date.now(), iv = setInterval(function(){
            var el = (Date.now() - t0) / 1000, left = Math.max(0, Math.ceil(secs - el));
            var bar = document.getElementById('redir_bar'), tx = document.getElementById('redir_txt');
            if (bar) bar.style.width = Math.min(100, el / secs * 100) + '%';
            if (tx) tx.textContent = 'מעבירים אותך בעוד ' + left + ' שניות…';
            if (el >= secs){ clearInterval(iv); window.location.href = route.url; }
          }, 100);
        }
      }
    } else if (waLink()){
      panel.appendChild(h('a', {class:'btn sec', href:waLink(), target:'_blank', rel:'noopener'}, ['שיחה בוואטסאפ']));
    }
    root.appendChild(panel);
    window.scrollTo(0, 0);
  }

  // ---------------- preview (inside the admin screen) ----------------
  function postToParent(msg){ try{ if (window.parent !== window) window.parent.postMessage(msg, '*'); }catch(e){} }
  function showPreviewResult(payload, route){
    var old = document.getElementById('preview_result'); if (old) old.remove();
    var ok = route.type === 'redirect' ? !!route.url : true;
    var box = h('div', {class:'preview-result' + (ok ? '' : ' bad'), id:'preview_result'}, [
      h('div', {}, [h('b', {text:'תוצאת הבדיקה'})]),
      h('div', {text:'ניתוב שנבחר: ' + route.source}),
      route.type === 'redirect'
        ? h('div', {}, ['הלקוח היה מועבר אל: ', h('code', {text:route.url || '(חסר קישור!)'})])
        : h('div', {text:'הלקוח היה רואה הודעה: ' + (route.message || '(ללא הודעה)')}),
      h('div', {text:'נשמר בגיליון: ' + (payload.fixed.childName || '—') + ' · ' + (payload.fixed.phone || '—') + ' · ' + (payload.fixed.groups || 'ללא קבוצות')})
    ]);
    root.appendChild(box);
    box.scrollIntoView({behavior:'smooth', block:'center'});
    postToParent({type:'tatami-preview-result', valid:true, route:route, payload:payload});
  }

  // ---------------- start ----------------
  function start(config){
    cfg = config;
    applyBrand();
    formCfg = cfg && cfg.forms && cfg.forms[FORM];
    if (!formCfg || formCfg.enabled === false){
      root.innerHTML = '';
      root.appendChild(h('div', {class:'panel'}, [h('div', {class:'ic-plain', text:'⏸'}), h('h2', {text:'ההרשמה אינה זמינה כרגע'}), h('p', {text:'אפשר לפנות אלינו ישירות:'}), waLink() ? h('a', {class:'btn sec', href:waLink()}, ['וואטסאפ']) : '']));
      return;
    }
    if (!PREVIEW) loadDraft();
    render();
  }

  if (PREVIEW){
    window.addEventListener('message', function(ev){
      if (ev.source !== window.parent || !ev.data || ev.data.type !== 'tatami-config') return;
      answers = {}; start(ev.data.config);
    });
    postToParent({type:'tatami-form-ready'});
  } else {
    (function load(){
      jsonp('&action=formConfig', 20000).then(function(d){
        if (!d || !d.config) { start(null); return; }
        start(d.config);
      }).catch(function(){
        root.innerHTML = '';
        root.appendChild(h('div', {class:'panel'}, [h('h2', {text:'לא הצלחנו לטעון את הטופס'}), h('p', {text:'בדקו את החיבור לאינטרנט ונסו שוב.'}), h('button', {class:'btn', onclick:function(){ window.location.reload(); }}, ['נסו שוב'])]));
      });
    })();
  }
})();
</script>
</body>
</html>
